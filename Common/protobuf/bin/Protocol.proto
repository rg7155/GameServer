syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2; 
}


message C_COMMAND
{
	Player player = 1; 
}
message S_COMMAND
{
	Player player = 1;
}

message C_CHAT
{
	Player player = 1;
	string msg = 2;
}

message S_CHAT
{
	Player player = 1;
	string msg = 2;
}