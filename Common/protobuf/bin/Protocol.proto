syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_LOGIN
{
	string name = 1;
}

message S_LOGIN
{
	bool success = 1;
	Player player = 2; 
}


message C_COMMAND
{
	string msg = 1;
}
message S_COMMAND
{
	ChatType chatType = 1;
	uint64 channel = 2;
}

message C_CHAT
{
	string msg = 1;
	ChatType chatType = 2;
	uint64 channel = 3;
	uint64 playerId = 4;
}

message S_CHAT
{
	string msg = 1;
	ChatType chatType = 2;
	uint64 channel = 3;
	uint64 playerId = 4;
}